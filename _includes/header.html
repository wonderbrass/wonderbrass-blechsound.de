<header>
  <nav class="navbar navbar-dark navbar-expand-md fixed-top navbar-brasscombo">
    <div class="container">
      <div class="navbar-top-row">
        <a class="navbar-brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} – zur Startseite">
          <picture>
            <!-- Helles Systemschema: dunkles Logo passend zur hellen (Tertiärfarbe) Navbar -->
            <source srcset="{{ '/assets/brand/WB-Logo-Dark.svg' | relative_url }}" media="(prefers-color-scheme: light)">
            <img src="{{ '/assets/brand/WB-Logo-Light.svg' | relative_url }}" alt="{{ site.title }}" class="navbar-logo">
          </picture>
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#hauptnavigation"
                aria-controls="hauptnavigation" aria-expanded="false" aria-label="Navigation umschalten">
          <span class="navbar-toggler-bar"></span>
          <span class="navbar-toggler-bar"></span>
          <span class="navbar-toggler-bar"></span>
        </button>
      </div>

      <div class="collapse navbar-collapse" id="hauptnavigation">
        <ul class="navbar-nav ms-auto mb-0">
          {% for item in site.data.navigation %}
            {% assign item_path = item.url | relative_url %}
            <li class="nav-item">
              <a class="nav-link {% if page.url == item.url %}active{% endif %}"
                 href="{{ item_path }}"
                 {% if page.url == item.url %}aria-current="page"{% endif %}>
                {{ item.title }}
              </a>
            </li>
          {% endfor %}
        </ul>
      </div>
    </div>
  </nav>
</header>
