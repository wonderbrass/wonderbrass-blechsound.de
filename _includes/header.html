<header>
  <nav class="navbar navbar-expand-md fixed-top navbar-brasscombo">
    <div class="container">
      <a class="navbar-brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} – zur Startseite">
        <img src="{{ '/assets/brand/WB-Logo-Dark.svg' | relative_url }}" alt="{{ site.title }}" class="navbar-logo">
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#hauptnavigation"
              aria-controls="hauptnavigation" aria-expanded="false" aria-label="Navigation umschalten">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="hauptnavigation">
        <ul class="navbar-nav ms-auto mb-0">
          {% for item in site.data.navigation %}
            {% assign item_path = item.url | relative_url %}
            <li class="nav-item">
              <a class="nav-link {% if page.url == item.url %}active{% endif %}"
                 href="{{ item_path }}"
                 {% if page.url == item.url %}aria-current="page"{% endif %}>
                {{ item.title }}
              </a>
            </li>
          {% endfor %}
        </ul>
      </div>
    </div>
  </nav>
</header>
