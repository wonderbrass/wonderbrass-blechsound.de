# ----------------------------------------------------------------
# Grundeinstellungen – bitte an eure Band anpassen
# ----------------------------------------------------------------
title: "Wonderbrass"
tagline: "Blechsound Pur"
lang: de

# Wird u.a. für kanonische URLs / Sitemap / RSS benötigt.
# Für GitHub Pages im Schema https://<user>.github.io/<repo>
url: "https://wonderbrass.github.io"
baseurl: "/wonderbrass-blechsound.de"

# ----------------------------------------------------------------
# Bandkontakt (im Footer & auf der Startseite genutzt)
# ----------------------------------------------------------------
contact:
  organisation: "Wonderbrass GbR"
  admin: "Mathias Kessler"
  owner: "Alexander Unmuth"
  email: "info@wonderbrass-blechsound.de"
  address_line1: "Kirchsteige 10"
  address_line2: "72393 Burladingen"

social:
  instagram: "https://instagram.com/wonderbrass_blechsound"
  facebook: "https://facebook.com/"
  youtube: "https://youtube.com/"
  github: "https://github.com/wonderbrass/wonderbrass-blechsound.de"

# ----------------------------------------------------------------
# Theme-Color (färbt u.a. die Adresszeile/Tab-Leiste unter iOS/macOS
# Safari sowie den Splashscreen bei "Zum Home-Bildschirm"). Muss mit
# $brass-gold in _sass/_variables.scss übereinstimmen.
# ----------------------------------------------------------------
theme_color: "#B0892D"

# ----------------------------------------------------------------
# Sass / Bootstrap
# ----------------------------------------------------------------
sass:
  style: compressed
  load_paths:
    - _sass
  # Unterdrückt Deprecation-Warnungen aus Abhängigkeiten (z.B. der
  # Bootstrap-Gem) – Warnungen aus unserem eigenen _sass/-Code
  # werden weiterhin angezeigt.
  quiet_deps: true

# ----------------------------------------------------------------
# Build
# ----------------------------------------------------------------
markdown: kramdown
permalink: pretty

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - README.md
  - "*.gemspec"

defaults:
  - scope:
      path: ""
    values:
      layout: "page"
